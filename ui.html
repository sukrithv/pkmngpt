<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pkmngpt</title>
<style>
  :root {
    /* base — a calm technical dark, not cartoonish */
    --bg: #12141a;
    --panel: #1a1d26;
    --panel-2: #21252f;
    --line: #2c313d;
    --ink: #e8eaf0;
    --ink-dim: #9aa1b2;
    --ink-faint: #6b7080;
    --user: #2a3550;
    --accent: #7cc4ff;

    /* one color per engine — the characteristic element of this system */
    --e-sql:            #6ee7b7;  /* facts / green */
    --e-pokemon_rag:    #f0abfc;  /* lore / orchid */
    --e-concept_rag:    #93c5fd;  /* mechanics / blue */
    --e-api_tool:       #fcd34d;  /* move-ability / amber */
    --e-smogon_sets:    #fb923c;  /* builds / orange */
    --e-smogon_analyses:#f87171;  /* viability / red */
    --e-damage_calc:    #c4b5fd;  /* math / violet */
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f6f8; --panel: #ffffff; --panel-2: #eef0f4;
      --line: #dfe2e8; --ink: #1a1d26; --ink-dim: #565c6b;
      --ink-faint: #8b91a0; --user: #dbe6ff; --accent: #2563eb;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    height: 100dvh;
  }

  header {
    display: flex; align-items: baseline; gap: .6rem;
    padding: .9rem 1.2rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header .mark {
    font-weight: 700; letter-spacing: -.02em; font-size: 1.05rem;
  }
  header .mark span { color: var(--accent); }
  header .sub { color: var(--ink-faint); font-size: .82rem; }

  #log {
    flex: 1; overflow-y: auto;
    padding: 1.4rem 1.2rem 2rem;
    display: flex; flex-direction: column; gap: 1.3rem;
    max-width: 820px; width: 100%; margin: 0 auto;
  }

  .turn { display: flex; flex-direction: column; gap: .5rem; }
  .turn.user { align-items: flex-end; }

  .bubble {
    max-width: 90%;
    padding: .7rem .9rem;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user .bubble {
    background: var(--user);
    border-bottom-right-radius: 4px;
  }
  .bot .bubble {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  /* routing badges — the distinctive part: shows how the system answered */
  .routes { display: flex; flex-wrap: wrap; gap: .35rem; }
  .route {
    font-size: .72rem; font-weight: 600;
    padding: .12rem .5rem;
    border-radius: 999px;
    border: 1px solid currentColor;
    display: inline-flex; align-items: center; gap: .35rem;
    background: color-mix(in srgb, currentColor 12%, transparent);
  }
  .route::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }
  .route.sql            { color: var(--e-sql); }
  .route.pokemon_rag    { color: var(--e-pokemon_rag); }
  .route.concept_rag    { color: var(--e-concept_rag); }
  .route.api_tool       { color: var(--e-api_tool); }
  .route.smogon_sets    { color: var(--e-smogon_sets); }
  .route.smogon_analyses{ color: var(--e-smogon_analyses); }
  .route.damage_calc    { color: var(--e-damage_calc); }

  .meta { color: var(--ink-faint); font-size: .74rem; }

  /* composer */
  form {
    display: flex; gap: .6rem; align-items: flex-end;
    padding: .9rem 1.2rem 1.1rem;
    border-top: 1px solid var(--line);
    background: var(--panel);
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  textarea {
    flex: 1; resize: none;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    padding: .65rem .8rem; font: inherit;
    max-height: 8rem; min-height: 2.6rem;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    background: var(--accent); color: #08121f;
    border: 0; border-radius: 12px;
    padding: .65rem 1.1rem; font: inherit; font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }

  .hint { color: var(--ink-faint); font-size: .8rem; }
  .thinking { color: var(--ink-dim); font-style: italic; }

  .empty {
    color: var(--ink-faint); text-align: center;
    margin: auto; max-width: 30rem;
  }
  .empty h1 { color: var(--ink); font-weight: 700; letter-spacing: -.02em; }
  .examples { display: flex; flex-direction: column; gap: .45rem; margin-top: 1rem; }
  .ex {
    text-align: left; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--ink-dim); border-radius: 10px; padding: .5rem .7rem;
    cursor: pointer; font: inherit;
  }
  .ex:hover { color: var(--ink); border-color: var(--accent); }

  @media (prefers-reduced-motion: no-preference) {
    .turn { animation: rise .18s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  }
</style>
</head>
<body>
  <header>
    <span class="mark">pkmn<span>gpt</span></span>
    <span class="sub">multi-engine Pokémon assistant</span>
  </header>

  <div id="log">
    <div class="empty" id="empty">
      <h1>Ask about anything Pokémon</h1>
      <p class="hint">Stats, lore, mechanics, competitive sets, viability, or damage —
      the assistant routes each question to the right engine.</p>
      <div class="examples">
        <button class="ex">Which Generation I Fire-type has the highest base Attack?</button>
        <button class="ex">Why is Gyarados so violent?</button>
        <button class="ex">What's the standard competitive set for Garchomp in OU?</button>
        <button class="ex">How much does Choice Band Garchomp's Earthquake do to Kingambit?</button>
      </div>
    </div>
  </div>

  <form id="composer">
    <textarea id="q" placeholder="Ask a question…" rows="1" autocomplete="off"></textarea>
    <button id="send" type="submit">Ask</button>
  </form>

<script>
const API = (location.origin.startsWith("http") ? location.origin : "http://localhost:8000") + "/ask";
const log = document.getElementById("log");
const empty = document.getElementById("empty");
const form = document.getElementById("composer");
const input = document.getElementById("q");
const send = document.getElementById("send");

const LABELS = {
  sql: "Facts", pokemon_rag: "Lore", concept_rag: "Mechanics",
  api_tool: "Move/Ability", smogon_sets: "Sets",
  smogon_analyses: "Viability", damage_calc: "Damage",
};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function addTurn(role, text) {
  const turn = el("div", "turn " + role);
  turn.appendChild(el("div", "bubble", text));
  log.appendChild(turn);
  log.scrollTop = log.scrollHeight;
  return turn;
}

function addRoutes(turn, routing, meta) {
  const fired = Object.keys(routing || {}).filter(k => routing[k]);
  if (fired.length) {
    const box = el("div", "routes");
    fired.forEach(k => box.appendChild(el("span", "route " + k, LABELS[k] || k)));
    turn.appendChild(box);
  }
  if (meta && (meta.pokemon_name || meta.generation || meta.tier)) {
    const bits = [];
    if (meta.pokemon_name) bits.push(meta.pokemon_name);
    if (meta.generation)   bits.push(meta.generation);
    if (meta.tier)         bits.push(meta.tier);
    turn.appendChild(el("div", "meta", bits.join(" · ")));
  }
}

async function ask(question) {
  if (empty) empty.remove();
  addTurn("user", question);
  const botTurn = el("div", "turn bot");
  const bubble = el("div", "bubble thinking", "Thinking…");
  botTurn.appendChild(bubble);
  log.appendChild(botTurn);
  log.scrollTop = log.scrollHeight;
  send.disabled = true;

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    bubble.classList.remove("thinking");
    bubble.textContent = data.answer || "No answer returned.";
    addRoutes(botTurn, data.routing, data.meta);
  } catch (err) {
    bubble.classList.remove("thinking");
    bubble.textContent = "Couldn't reach the backend. Is the API running on port 8000?";
  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  input.style.height = "auto";
  ask(q);
});

// Enter to send, Shift+Enter for newline
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 128) + "px";
});

document.querySelectorAll(".ex").forEach(b =>
  b.addEventListener("click", () => ask(b.textContent)));

input.focus();
</script>
</body>
</html>
